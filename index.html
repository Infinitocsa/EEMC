!DOCTYPE html>
<html>
  <head>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  </head>

  <body style="margin: 0; overflow: hidden;">
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">

      <!-- ENTIDADE PAI: CUBO COMPLETO -->
      <a-entity id="cubo"
                animation="property: rotation; to: 0 360 0; loop: true; dur: 6000; easing: linear; delay: 2000">

        <!-- FACE 1 (frente) -->
        <a-plane height="1" width="1" position="0 0.5 0.5"
          material="src: url(textura1.jpg)"
          animation="property: position; from: 0 0.5 2; to: 0 0.5 0.5; dur: 800;">
        </a-plane>

        <!-- FACE 2 (direita) -->
        <a-plane height="1" width="1" position="0.5 0.5 0" rotation="0 90 0"
          material="src: url(textura2.jpg)"
          animation="property: position; from: 2 0.5 0; to: 0.5 0.5 0; dur: 800; delay: 300;">
        </a-plane>

        <!-- FACE 3 (esquerda) -->
        <a-plane height="1" width="1" position="-0.5 0.5 0" rotation="0 -90 0"
          material="src: url(textura3.jpg)"
          animation="property: position; from: -2 0.5 0; to: -0.5 0.5 0; dur: 800; delay: 600;">
        </a-plane>

        <!-- FACE 4 (trás) -->
        <a-plane height="1" width="1" position="0 0.5 -0.5" rotation="0 180 0"
          material="src: url(textura4.jpg)"
          animation="property: position; from: 0 0.5 -2; to: 0 0.5 -0.5; dur: 800; delay: 900;">
        </a-plane>

        <!-- TAMPO (cima) -->
        <a-plane height="1" width="1" position="0 1 0" rotation="-90 0 0"
          material="src: url(textura5.jpg)"
          animation="property: position; from: 0 3 0; to: 0 1 0; dur: 800; delay: 1200;">
        </a-plane>

        <!-- FUNDO (baixo) -->
        <a-plane height="1" width="1" position="0 0 0" rotation="90 0 0"
          material="src: url(textura6.jpg)"
          animation="property: position; from: 0 -3 0; to: 0 0 0; dur: 800; delay: 1500;">
        </a-plane>

      </a-entity>

      <a-marker-camera preset="hiro"></a-marker-camera>
    </a-scene>
  </body>
</html>
