<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101114">
  <title>Livro Interativo — Realidade Aumentada</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }

    /* A câmera permanece como fundo; o canvas da RA precisa ser transparente. */
    a-scene {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      background: transparent !important;
    }
    a-scene canvas {
      background: transparent !important;
    }

    #status {
      position: fixed;
      z-index: 20;
      left: 50%;
      bottom: max(18px, env(safe-area-inset-bottom));
      transform: translateX(-50%);
      width: calc(100% - 32px);
      max-width: 520px;
      padding: 11px 15px;
      color: #fff;
      text-align: center;
      line-height: 1.35;
      background: rgba(0, 0, 0, .76);
      border: 1px solid rgba(255, 255, 255, .22);
      border-radius: 12px;
      font-size: 14px;
      pointer-events: none;
      transition: opacity .25s ease;
    }
    #status.hidden { opacity: 0; }

    #sound {
      display: none;
      position: fixed;
      z-index: 21;
      left: 50%;
      bottom: max(76px, calc(env(safe-area-inset-bottom) + 76px));
      transform: translateX(-50%);
      max-width: calc(100% - 32px);
      padding: 13px 20px;
      border: 0;
      border-radius: 999px;
      color: #171717;
      background: #fff;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }
    #sound.show { display: block; }
  </style>
</head>
<body>
  <div id="status" role="status" aria-live="polite">
    Carregando… permita o acesso à câmera quando solicitado.
  </div>
  <button id="sound" type="button">Ativar som do vídeo</button>

  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiLoading: no; uiScanning: no; filterMinCF: 0.0001; filterBeta: 0.001"
    color-space="sRGB"
    renderer="alpha: true; antialias: true; colorManagement: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-assets>
      <video
        id="videoTexture"
        src="./assets/video.mp4"
        preload="auto"
        playsinline
        webkit-playsinline
        muted
        loop
        crossorigin="anonymous">
      </video>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!--
      O marcador impresso é horizontal e mede 542 x 315.
      A proporção do plano corresponde exatamente à proporção do marcador.
      O plano fica preso ao alvo MindAR: não é um elemento fixo na tela.
      Assim, somente a área do marcador é coberta pelo vídeo; o restante
      da câmera continua visível.
    -->
    <a-entity id="imageTarget" mindar-image-target="targetIndex: 0">
      <a-video
        id="arVideoPlane"
        src="#videoTexture"
        width="1"
        height="0.58118"
        position="0 0 0.01"
        rotation="0 0 0"
        material="shader: flat; side: double">
      </a-video>
    </a-entity>
  </a-scene>

  <script>
    (() => {
      const scene = document.querySelector('a-scene');
      const target = document.getElementById('imageTarget');
      const video = document.getElementById('videoTexture');
      const statusBox = document.getElementById('status');
      const soundButton = document.getElementById('sound');

      let targetVisible = false;
      let hideStatusTimer = null;

      function showStatus(message, hideAfter = 0) {
        statusBox.textContent = message;
        statusBox.classList.remove('hidden');
        window.clearTimeout(hideStatusTimer);

        if (hideAfter > 0) {
          hideStatusTimer = window.setTimeout(() => {
            statusBox.classList.add('hidden');
          }, hideAfter);
        }
      }

      target.addEventListener('targetFound', async () => {
        targetVisible = true;
        soundButton.classList.add('show');
        soundButton.textContent = video.muted
          ? 'Ativar som do vídeo'
          : 'Som ativado';

        showStatus('Página reconhecida! Mantenha o livro visível para acompanhar o vídeo.', 3000);

        try {
          // Começa sem áudio para permitir autoplay em celulares.
          await video.play();
        } catch (error) {
          showStatus('Página reconhecida. Toque em Reproduzir vídeo para iniciar.', 0);
          soundButton.textContent = 'Reproduzir vídeo';
        }
      });

      target.addEventListener('targetLost', () => {
        targetVisible = false;
        video.pause();
        soundButton.classList.remove('show');
        showStatus('Aponte a câmera novamente para a página do livro.', 0);
      });

      soundButton.addEventListener('click', async () => {
        if (!targetVisible) return;

        try {
          video.muted = false;
          await video.play();
          soundButton.textContent = 'Som ativado';
          soundButton.classList.remove('show');
          showStatus('Vídeo reproduzindo com som.', 1800);
        } catch (error) {
          showStatus('Não foi possível reproduzir. Toque novamente para tentar.', 0);
        }
      });

      scene.addEventListener('arReady', () => {
        showStatus('Câmera pronta! Aponte para a página impressa do livro.', 0);
      });

      scene.addEventListener('arError', (event) => {
        console.error('Erro ao iniciar a realidade aumentada:', event);
        showStatus('Não foi possível iniciar a câmera. Verifique a permissão e abra o site por HTTPS.', 0);
      });

      video.addEventListener('error', () => {
        console.error('Erro ao carregar o vídeo:', video.error);
        showStatus('Não foi possível carregar o vídeo. Confira se assets/video.mp4 foi publicado.', 0);
      });

      window.addEventListener('beforeunload', () => video.pause());
    })();
  </script>
</body>
</html>
