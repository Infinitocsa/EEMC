<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#071b4d">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Realidade Aumentada — Escola Municipal</title>

  <!-- Versões atuais recomendadas pelo exemplo oficial do MindAR -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:Arial,sans-serif}
    /* ===== CÂMERA EM TELA CHEIA — MOBILE ===== */
    html, body {
      width: 100%;
      height: 100%;
      min-height: 100%;
      margin: 0 !important;
      padding: 0 !important;
      overflow: hidden !important;
      background: #000 !important;
    }

    #scene, a-scene {
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      height: 100dvh !important;
      min-width: 100vw !important;
      min-height: 100dvh !important;
      max-width: none !important;
      max-height: none !important;
      margin: 0 !important;
      padding: 0 !important;
      overflow: hidden !important;
      background: transparent !important;
      z-index: 2 !important;
    }

    #scene canvas, a-scene canvas, .a-canvas {
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      height: 100dvh !important;
      min-width: 100vw !important;
      min-height: 100dvh !important;
      max-width: none !important;
      max-height: none !important;
      margin: 0 !important;
      padding: 0 !important;
      display: block !important;
      background: transparent !important;
      z-index: 2 !important;
    }

    /* MindAR cria o <video> dinamicamente. O vídeo fica atrás do canvas transparente. */
    body > video,
    a-scene video,
    video.mindar-video,
    video[id*="mindar"],
    video[class*="mindar"] {
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      height: 100dvh !important;
      min-width: 100vw !important;
      min-height: 100dvh !important;
      max-width: none !important;
      max-height: none !important;
      margin: 0 !important;
      padding: 0 !important;
      border: 0 !important;
      transform: none !important;
      object-fit: cover !important;
      object-position: center center !important;
      display: block !important;
      visibility: visible !important;
      opacity: 1 !important;
      z-index: 1 !important;
    }

    .a-enter-vr, .a-enter-ar { display: none !important; }

    .ui{
      position:fixed;z-index:20;left:50%;top:14px;transform:translateX(-50%);
      width:min(94vw,560px);padding:12px 16px;border-radius:16px;
      background:rgba(4,12,35,.78);color:#fff;text-align:center;
      border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(8px);
      box-shadow:0 8px 30px rgba(0,0,0,.35)
    }
    .ui strong{display:block;font-size:17px;line-height:1.2}
    #status{display:block;margin-top:6px;font-size:13px;color:#b9f7c2;line-height:1.35}
    #startButton{
      position:fixed;z-index:30;left:50%;bottom:28px;transform:translateX(-50%);
      border:0;border-radius:999px;padding:15px 28px;font-size:16px;
      font-weight:700;background:#fff;color:#142b86;
      box-shadow:0 8px 28px rgba(0,0,0,.42);cursor:pointer
    }
    #startButton:active{transform:translateX(-50%) scale(.97)}
    #help{
      position:fixed;z-index:25;left:50%;bottom:88px;transform:translateX(-50%);
      width:min(92vw,520px);padding:10px 14px;border-radius:12px;
      background:rgba(0,0,0,.65);color:#fff;text-align:center;font-size:12px;line-height:1.35;
      display:none
    }
    #debug{position:fixed;z-index:40;left:8px;bottom:8px;max-width:calc(100vw - 16px);padding:7px 9px;border-radius:8px;background:rgba(0,0,0,.72);color:#ddd;font:10px monospace;display:none}
  </style>
</head>
<body>
  <div class="ui">
    <strong>Realidade Aumentada — Escola Municipal</strong>
    <span id="status">Toque em “INICIAR CÂMERA” e depois aponte para a imagem-alvo.</span>
  </div>

  <div id="help">Dica: mantenha a imagem-alvo inteira dentro da câmera, com boa iluminação e sem reflexos.</div>
  <button id="startButton">📷 INICIAR CÂMERA</button>
  <div id="debug"></div>

  <a-scene
    id="scene"
    mindar-image="imageTargetSrc: ./targets.mind; maxTrack: 1; filterMinCF: 0.0001; filterBeta: 0.001; missTolerance: 8; warmupTolerance: 5; uiLoading: no; uiScanning: no; uiError: no;"
    color-space="sRGB"
    renderer="alpha: true; colorManagement: true; physicallyCorrectLights: true; preserveDrawingBuffer: false"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    embedded>

    <a-assets>
      <img id="logo" src="./assets/logo.png" crossorigin="anonymous">
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity id="target" mindar-image-target="targetIndex: 0">
      <!-- Plano inicialmente vertical; a animação gira no eixo X. -->
      <a-plane
        id="logoPlane"
        src="#logo"
        position="0 0.30 0.18"
        width="0.62"
        height="0.615"
        rotation="90 0 0"
        material="transparent: true; alphaTest: 0.05; side: double"
        animation__spin="property: rotation; from: 90 0 0; to: 450 0 0; dur: 2800; easing: linear; loop: true">
      </a-plane>
    </a-entity>
  </a-scene>

  <script>
    const scene = document.querySelector('#scene');
    const target = document.querySelector('#target');
    const plane = document.querySelector('#logoPlane');
    const status = document.querySelector('#status');
    const button = document.querySelector('#startButton');
    const help = document.querySelector('#help');
    const debug = document.querySelector('#debug');

    // O MindAR cria a câmera depois que a cena é carregada.
    // Reaplicamos o layout para impedir que o navegador mantenha o vídeo estreito/deslocado.
    function forceCameraLayout() {
      document.querySelectorAll('video').forEach(video => {
        if (video.srcObject || video.className.toString().toLowerCase().includes('mindar') || video.id.toLowerCase().includes('mindar')) {
          video.setAttribute('playsinline', '');
          video.style.setProperty('position', 'fixed', 'important');
          video.style.setProperty('left', '0', 'important');
          video.style.setProperty('top', '0', 'important');
          video.style.setProperty('right', '0', 'important');
          video.style.setProperty('bottom', '0', 'important');
          video.style.setProperty('width', '100vw', 'important');
          video.style.setProperty('height', '100dvh', 'important');
          video.style.setProperty('min-width', '100vw', 'important');
          video.style.setProperty('min-height', '100dvh', 'important');
          video.style.setProperty('max-width', 'none', 'important');
          video.style.setProperty('max-height', 'none', 'important');
          video.style.setProperty('transform', 'none', 'important');
          video.style.setProperty('object-fit', 'cover', 'important');
          video.style.setProperty('object-position', 'center center', 'important');
          video.style.setProperty('z-index', '1', 'important');
        }
      });
    }

    const cameraObserver = new MutationObserver(forceCameraLayout);
    cameraObserver.observe(document.documentElement, { childList: true, subtree: true });
    window.addEventListener('resize', forceCameraLayout);
    window.addEventListener('orientationchange', () => setTimeout(forceCameraLayout, 250));
    setInterval(forceCameraLayout, 1000);
    forceCameraLayout();

    function setStatus(text, color) {
      status.textContent = text;
      status.style.color = color || '#b9f7c2';
    }

    function showError(message) {
      setStatus(message, '#ff9b9b');
      help.style.display = 'block';
      button.style.display = 'block';
    }

    target.addEventListener('targetFound', () => {
      setStatus('Imagem reconhecida! O logo está girando no eixo X.');
      help.style.display = 'none';
    });

    target.addEventListener('targetLost', () => {
      setStatus('Imagem perdida. Aponte novamente para a imagem-alvo.', '#fff');
      help.style.display = 'block';
    });

    scene.addEventListener('arReady', () => {
      setStatus('Câmera ativa — aponte para a imagem-alvo.');
      button.style.display = 'none';
      help.style.display = 'block';
    });

    scene.addEventListener('arError', (event) => {
      console.error('MindAR arError:', event.detail || event);
      showError('O navegador/dispositivo não conseguiu iniciar a realidade aumentada. Use Chrome no Android ou Safari no iPhone e permita a câmera.');
      debug.textContent = 'arError: ' + JSON.stringify(event.detail || {});
      debug.style.display = 'block';
    });

    scene.addEventListener('loaded', () => {
      console.log('A-Frame carregado. MindAR 1.2.5.');
    });

    async function startAR() {
      button.disabled = true;
      setStatus('Iniciando câmera…', '#fff');
      try {
        const arSystem = scene.systems['mindar-image-system'];
        if (!arSystem) throw new Error('Sistema MindAR não foi carregado.');
        await arSystem.start();
      } catch (error) {
        console.error(error);
        button.disabled = false;
        showError('Não foi possível iniciar a câmera. Verifique a permissão da câmera e use HTTPS.');
        debug.textContent = 'Erro: ' + (error && error.message ? error.message : error);
        debug.style.display = 'block';
      }
    }

    button.addEventListener('click', startAR);
  </script>
</body>
</html>
