<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Hello WebXR - Projeto AR</title>
  <meta name="description" content="Exemplo mínimo WebXR (AR) pronto para GitHub Pages.">
  <style>
    body { margin:0; font-family: sans-serif; background:#fff; color:#222; }
    #info { position: fixed; left: 12px; bottom: 12px; background: rgba(255,255,255,0.9); padding:8px 12px; border-radius:6px; box-shadow:0 2px 6px rgba(0,0,0,0.15); }
    button { padding:8px 12px; font-size:14px; }
    canvas { display:block; width:100%; height:100%; }
    .screenshot { max-width:240px; border:1px solid #ddd; margin-top:8px; }
  </style>
</head>
<body>
  <div id="container"></div>

  <div id="info">
    <div><strong>Hello WebXR (AR)</strong></div>
    <div style="margin-top:6px;">
      Abra este site em um <em>Android</em> (Chrome atualizado) com suporte a WebXR + ARCore.
    </div>
    <div style="margin-top:8px;">
      <button id="startBtn">Start Hello WebXR</button>
    </div>
    <img src="screenshot.png" alt="screenshot" class="screenshot">
    <div style="margin-top:8px; font-size:13px; color:#666;">
      Dica: hospede no GitHub Pages (HTTPS) e abra o link no Chrome do celular.
    </div>
  </div>

  <!-- three.js -->
  <script src="https://unpkg.com/three@0.126.0/build/three.js"></script>
  <script src="app.js"></script>
</body>
</html>
