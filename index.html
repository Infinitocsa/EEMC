<html>
  <head>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>
  </head>

  <body style="margin: 0; overflow: hidden;">
    <a-scene
      embedded
      arjs="sourceType: webcam; detectionMode: mono;"
    >
      <!-- Texto que mostra o número total -->
      <a-text
        id="contador"
        value="0"
        color="red"
        position="0 0 -2"
        width="3"
      ></a-text>

      <!-- Marcador HIRO -->
      <a-marker preset="hiro" id="marker1"></a-marker>

      <!-- Marcador KANJI -->
      <a-marker preset="kanji" id="marker2"></a-marker>

      <a-entity camera></a-entity>
    </a-scene>

    <script>
      const marker1 = document.getElementById("marker1");
      const marker2 = document.getElementById("marker2");
      const contador = document.getElementById("contador");

      function atualizarContagem() {
        let total = 0;
        if (marker1.object3D.visible) total++;
        if (marker2.object3D.visible) total++;
        contador.setAttribute("value", total.toString());
      }

      setInterval(atualizarContagem, 100);
    </script>
  </body>
</html>
